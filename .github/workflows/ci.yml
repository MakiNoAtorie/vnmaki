name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CTEST_PARALLEL_LEVEL: 4

jobs:
  windows-msvc:
    name: Windows / MSVC (${{ matrix.preset }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    env:
      CC: cl
      CXX: cl
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Ninja
        run: choco install ninja --no-progress -y
      - uses: ./.github/actions/install-sdl3-deps
      - uses: ./.github/actions/install-gpu-driver
      - uses: ./.github/actions/setup-shadercross
      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: windows-msvc-${{ matrix.preset }}
      - name: Configure, build and test
        if: matrix.preset != 'debug'
        run: cmake --workflow --preset ${{ matrix.preset }}
      # The debug job also runs the MSVC static analyzer on first-party code. Its warnings are
      # errors (VNMAKI_MSVC_ANALYZE in cmake/VnmakiOptions.cmake).
      - name: Configure (with /analyze)
        if: matrix.preset == 'debug'
        run: cmake --preset debug -DVNMAKI_MSVC_ANALYZE=ON
      - name: Build (with /analyze)
        if: matrix.preset == 'debug'
        run: cmake --build --preset debug
      - name: Test
        if: matrix.preset == 'debug'
        run: ctest --preset debug

  format:
    name: Format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
      - name: Check formatting
        run: git ls-files -z '*.cpp' '*.hpp' '*.h' | xargs -0 --no-run-if-empty clang-format-18 --dry-run --Werror
